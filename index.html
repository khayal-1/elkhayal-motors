<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="El Khayal Motors — منصة الدراجات النارية.">
  <meta name="theme-color" content="#0F0F0F">
  <title>El Khayal Motors | معرض الدراجات النارية</title>

  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============================================================
       TOP HEADER
       ============================================================ -->
  <header class="topbar" id="topbar">
    <div class="topbar-right">
      <button class="menu-toggle" id="menuToggle" aria-label="فتح/طي القائمة" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
      </button>
      <a href="#" class="brand" data-nav="home" aria-label="El Khayal Motors — الرئيسية">
        <div class="brand-logo"><i class="fa-solid fa-motorcycle"></i></div>
        <div class="brand-name">
          <span class="brand-title">El Khayal</span>
          <span class="brand-sub">MOTORS</span>
        </div>
      </a>
    </div>

    <div class="topbar-left" id="accountArea" aria-live="polite"></div>
    <button class="btn btn-ghost-light btn-sm" id="languageToggle" type="button" aria-label="Change language">English</button>
  </header>

  <!-- ============================================================
       COLLAPSIBLE SIDEBAR
       ============================================================ -->
  <aside class="sidebar" id="sidebar" aria-label="القائمة الجانبية">
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <!-- ============================================================
       MAIN CONTENT (SPA Router Target)
       ============================================================ -->
  <main class="main-content" id="mainContent" role="main"></main>

  <!-- ============================================================
       MODAL
       ============================================================ -->
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>
  </div>

  <!-- ============================================================
       TOAST
       ============================================================ -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- App Script -->
  <script type="module" src="app.js"></script>
</body>
</html>
